<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Sports Player</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
    .header{background:#000;padding:14px;text-align:center;border-bottom:1px solid #1a1a1a;flex-shrink:0}
    .header h1{font-size:18px;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .header .sub{font-size:11px;color:#666;margin-top:4px}
    #playerContainer{background:#000;flex-shrink:0;position:relative}
    video{width:100%;max-height:40vh;display:block}
    #status{position:absolute;top:10px;left:10px;padding:6px 12px;background:rgba(0,0,0,.8);border-radius:15px;font-size:11px;z-index:9}
    #status.loading{color:#f59e0b}#status.playing{color:#22c55e}#status.error{color:#ef4444}
    .spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border:3px solid #1a1a1a;border-top-color:#ef4444;border-radius:50%;animation:spin 1s linear infinite;z-index:8}
    @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    .controls-bar{background:#111;padding:8px;flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap}
    button{padding:8px 14px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#ddd;font-size:12px;cursor:pointer;white-space:nowrap}
    button:hover{background:#2a2a2a}
    button.active{background:#ef4444;border-color:#ef4444;color:#fff}
    .grid{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .card{background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:12px;cursor:pointer;text-align:center;font-size:11px;font-weight:600;color:#ddd;transition:all .15s}
    .card:hover{background:#1a0a0a;border-color:#ef4444}
    .card.active{background:#1a0a0a;border-color:#22c55e;color:#22c55e}
    .search{width:100%;padding:8px 12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-size:12px;outline:none;flex-shrink:0;margin:6px 8px}
    .search:focus{border-color:#ef4444}
  </style>
</head>
<body>

<div class="header">
  <h1>⚽ Sports Player</h1>
  <div class="sub" id="channelName">Loading...</div>
</div>

<div id="playerContainer">
  <video id="video" playsinline controls autoplay></video>
  <div id="status">Ready</div>
  <div class="spinner" id="spinner" style="display:none"></div>
</div>

<div class="controls-bar" id="categories"></div>
<input type="text" class="search" id="searchBox" placeholder="🔍 Search channels..." oninput="filterChannels()">

<div class="grid" id="channelGrid"></div>

<script>
var API = "https://sonujson-devloper.vercel.app/Data/sports.json";
var player = null;
var allChannels = [];
var currentChannel = null;
var activeCategory = "All";

function toast(msg, type) {
  var s = document.getElementById("status");
  s.textContent = msg;
  s.className = type || "";
  setTimeout(function() { s.className = ""; }, 3000);
}

function showSpinner() { document.getElementById("spinner").style.display = "block"; }
function hideSpinner() { document.getElementById("spinner").style.display = "none"; }

function rawCookie(c) { return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || ""); }

function destroyPlayer() {
  if (player) { try { player.destroy(); } catch(e) {} player = null; }
  var v = document.getElementById("video");
  v.pause(); v.removeAttribute("src"); v.load();
}

function playChannel(ch) {
  destroyPlayer();
  currentChannel = ch;
  document.getElementById("channelName").textContent = ch.name;
  
  showSpinner();
  toast("Loading " + ch.name + "...", "loading");
  
  shaka.polyfill.installAll();
  
  if (!shaka.Player.isBrowserSupported()) {
    hideSpinner();
    toast("Browser not supported", "error");
    return;
  }
  
  player = new shaka.Player();
  player.attach(document.getElementById("video"));
  
  var config = {
    drm: {},
    manifest: { retryParameters: { maxAttempts: 3, baseDelay: 500, timeout: 15000 } },
    streaming: { bufferingGoal: 10, retryParameters: { maxAttempts: 3, baseDelay: 500, timeout: 15000 } }
  };
  
  if (ch.key_id && ch.key) {
    config.drm.clearKeys = {};
    config.drm.clearKeys[ch.key_id] = ch.key;
  }
  
  player.configure(config);
  
  var cookie = ch.cookie || "";
  var raw = rawCookie(cookie);
  
  player.getNetworkingEngine().registerRequestFilter(function(type, req) {
    req.headers["Referer"] = "https://www.jiotv.com/";
    req.headers["Origin"] = "https://www.jiotv.com";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36";
    if (cookie) req.headers["Cookie"] = cookie;
    
    if (raw && (type === 0 || type === 1)) {
      req.uris = req.uris.map(function(u) {
        if (u.indexOf("__hdnea__") === -1) {
          return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + raw;
        }
        return u;
      });
    }
  });
  
  player.addEventListener("error", function(ev) {
    var err = ev.detail;
    hideSpinner();
    toast("Error: " + (err.message || err.code), "error");
  });
  
  var url = (ch.stream_url || "").replace(/\/\//g, "/").replace(":/", "://");
  
  player.load(url).then(function() {
    hideSpinner();
    toast("▶ " + ch.name, "playing");
    document.getElementById("video").play().catch(function() {});
  }).catch(function(e) {
    hideSpinner();
    toast("Stream unavailable", "error");
  });
  
  renderChannels();
}

function filterChannels() {
  var search = (document.getElementById("searchBox").value || "").toLowerCase();
  var filtered = allChannels;
  
  if (activeCategory !== "All") {
    filtered = filtered.filter(function(ch) { return ch.category === activeCategory; });
  }
  
  if (search) {
    filtered = filtered.filter(function(ch) {
      return ch.name.toLowerCase().includes(search);
    });
  }
  
  var html = "";
  filtered.forEach(function(ch) {
    var active = currentChannel && currentChannel.id === ch.id;
    html += '<div class="card' + (active ? ' active' : '') + '" onclick="playChannel(' + JSON.stringify(ch).replace(/"/g, '&quot;') + ')">' + ch.name + '</div>';
  });
  
  document.getElementById("channelGrid").innerHTML = html || '<div style="color:#555;text-align:center;padding:20px">No channels found</div>';
}

function renderCategories() {
  var cats = {};
  allChannels.forEach(function(ch) {
    if (ch.category) cats[ch.category] = true;
  });
  
  var html = '<button class="' + (activeCategory === "All" ? "active" : "") + '" onclick="setCategory(\'All\')">All</button>';
  Object.keys(cats).sort().forEach(function(cat) {
    html += '<button class="' + (activeCategory === cat ? "active" : "") + '" onclick="setCategory(\'' + cat + '\')">' + cat + '</button>';
  });
  
  document.getElementById("categories").innerHTML = html;
}

function setCategory(cat) {
  activeCategory = cat;
  renderCategories();
  filterChannels();
}

function renderChannels() {
  renderCategories();
  filterChannels();
}

// Load channels
fetch(API, { headers: { Accept: "application/json" } })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    allChannels = d.channels || [];
    document.getElementById("channelName").textContent = allChannels.length + " channels";
    renderChannels();
    if (allChannels.length > 0) {
      playChannel(allChannels[0]);
    }
  })
  .catch(function() {
    document.getElementById("channelName").textContent = "Connection error";
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sportlink · Live Sports</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* LOADING SCREEN */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 24px;
      backdrop-filter: blur(10px);
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(239, 68, 68, 0.2);
      border-top: 2px solid #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 0 24px;
    }

    /* CHANNEL GRID SCREEN */
    .channels-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      z-index: 100;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(239, 68, 68, 0.08) 0%, transparent 60%);
    }

    .channels-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #ef4444;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .live-badge {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      padding-bottom: 24px;
    }

    .channel-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .channel-card:hover {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.15);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .card-name {
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      line-height: 1.3;
    }

    /* PLAYER SCREEN */
    .player-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 200;
    }

    .player-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    video.fit-fill {
      object-fit: fill;
    }

    video.fit-cover {
      object-fit: cover;
    }

    .plyr {
      width: 100%;
      height: 100%;
    }

    .plyr--video {
      height: 100%;
    }

    .plyr__video-wrapper {
      height: 100%;
    }

    /* Custom controls overlay */
    .custom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 600;
    }

    .ctrl-btn.active {
      background: #ef4444;
    }

    .ctrl-btn svg {
      width: 18px;
      height: 18px;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
    }

    .channel-title-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 8px 20px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
    }

    /* Status toast */
    .status-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(15, 15, 20, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      color: #e2e8f0;
    }

    .status-toast.show {
      opacity: 1;
    }
    .status-toast.error {
      color: #f87171;
    }
    .status-toast.warning {
      color: #fb923c;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loader"></div>
    <p id="loadingMessage" class="loading-text">Loading sport channels...</p>
  </div>

  <!-- Status Toast -->
  <div id="statusToast" class="status-toast"></div>

  <!-- Channel List Screen -->
  <div id="channelsScreen" class="channels-screen">
    <div class="channels-header">
      <div class="logo">
        <div class="logo-icon">▶</div>
        <span class="logo-text">Sportlink</span>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span> LIVE
      </div>
    </div>
    <div id="channelGrid" class="grid-container"></div>
  </div>

  <!-- Player Screen -->
  <div id="playerScreen" class="player-screen">
    <div class="player-container" id="playerContainer">
      <button class="back-btn" id="backButton" title="Back to channels">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="channel-title-bar" id="channelTitle">Loading...</div>
      <video id="videoPlayer" playsinline crossorigin="anonymous"></video>
      <div class="custom-controls" id="customControls">
        <button class="ctrl-btn" id="pipButton" title="Picture in Picture">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="ctrl-btn" id="fitButton" title="Fit mode">
          <span id="fitIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg></span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
  <script>
    (function() {
      "use strict";

      const API = "https://sonujson-devloper.vercel.app/Data/sports.json";
      
      // DOM Elements
      const loadingScreen = document.getElementById('loadingScreen');
      const loadingMessage = document.getElementById('loadingMessage');
      const statusToast = document.getElementById('statusToast');
      const channelsScreen = document.getElementById('channelsScreen');
      const channelGrid = document.getElementById('channelGrid');
      const playerScreen = document.getElementById('playerScreen');
      const videoPlayer = document.getElementById('videoPlayer');
      const channelTitle = document.getElementById('channelTitle');
      const backButton = document.getElementById('backButton');
      const pipButton = document.getElementById('pipButton');
      const fitButton = document.getElementById('fitButton');
      const fitIcon = document.getElementById('fitIcon');

      let currentChannel = null;
      let player = null;
      let plyrInstance = null;
      let fitMode = 0; // 0: contain, 1: fill, 2: cover
      const fitModes = ['contain', 'fill', 'cover'];
      const fitIcons = {
        contain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',
        fill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
        cover: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 7l3 3m0 0H7m2 0V8m9-1l-3 3m0 0h2m-2 0V8M6 13l3-3m0 0H7m2 0v2m9 1l-3-3m0 0h2m-2 0v2"/></svg>'
      };

      let statusTimer = null;

      function showStatus(msg, type = '', duration = 4000) {
        statusToast.textContent = msg;
        statusToast.className = 'status-toast show ' + type;
        if (statusTimer) clearTimeout(statusTimer);
        if (duration > 0) {
          statusTimer = setTimeout(() => {
            statusToast.classList.remove('show');
          }, duration);
        }
      }

      function setLoadingMessage(msg) {
        loadingMessage.textContent = msg;
      }

      function getTier() {
        const mem = navigator.deviceMemory || 4;
        const cores = navigator.hardwareConcurrency || 4;
        const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const net = conn ? (conn.effectiveType || "4g") : "4g";
        if (!mobile) return "high";
        if (mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
        if (mem <= 3 || cores <= 4) return "mid";
        return "high";
      }

      const TIER = getTier();
      const PROF = {
        low: { buf: 5, reBuf: 1.5, behind: 15, maxH: 480, maxBw: 1200000, bwEst: 400000 },
        mid: { buf: 8, reBuf: 1.5, behind: 25, maxH: 720, maxBw: 3500000, bwEst: 1000000 },
        high: { buf: 12, reBuf: 1.5, behind: 30, maxH: 1080, maxBw: 0, bwEst: 2000000 }
      }[TIER];

      function getChannelId() {
        return new URLSearchParams(location.search).get("id") || "";
      }

      function rawCookie(c) {
        return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
      }

      function withCookie(u, r) {
        if (!u || !r) return u;
        if (u.indexOf("__hdnea__") !== -1) return u;
        return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
      }

      async function fetchChannels() {
        const response = await fetch(API, { cache: "no-store", headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!data || !Array.isArray(data.channels) || !data.channels.length) throw new Error("No channels available");
        return data.channels;
      }

      function renderChannelList(channels) {
        channelGrid.innerHTML = '';
        channels.forEach(ch => {
          const card = document.createElement('a');
          card.className = 'channel-card';
          card.href = `?id=${encodeURIComponent(ch.id)}`;
          card.innerHTML = `
            <div class="card-icon">📺</div>
            <span class="card-name">${ch.name}</span>
          `;
          channelGrid.appendChild(card);
        });
        loadingScreen.style.display = 'none';
        channelsScreen.style.display = 'flex';
      }

      function applyFitMode() {
        videoPlayer.classList.remove('fit-fill', 'fit-cover');
        if (fitMode === 1) videoPlayer.classList.add('fit-fill');
        if (fitMode === 2) videoPlayer.classList.add('fit-cover');
        fitIcon.innerHTML = fitIcons[fitModes[fitMode]];
      }

      async function initializePlayer(channel) {
        playerScreen.style.display = 'flex';
        channelsScreen.style.display = 'none';
        loadingScreen.style.display = 'none';
        channelTitle.textContent = channel.name;
        currentChannel = channel;
        fitMode = 0;
        applyFitMode();

        if (plyrInstance) {
          plyrInstance.destroy();
        }

        // Initialize Plyr
        plyrInstance = new Plyr(videoPlayer, {
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
          settings: ['quality', 'speed'],
          quality: { default: 720, options: [4320, 2880, 2160, 1440, 1080, 720, 576, 480, 360, 240] },
          i18n: { quality: 'Quality' }
        });

        const cookie = channel.cookie;
        const raw = rawCookie(cookie);
        const keyId = channel.key_id;
        const key = channel.key;
        let streamUrl = channel.stream_url;
        let restrictionsRelaxed = false;
        let retries = 0;
        let refreshing = false;
        let lastRetry = 0;

        function buildConfig() {
          const restrictions = {};
          if (!restrictionsRelaxed) {
            if (PROF.maxH < 1080) restrictions.maxHeight = PROF.maxH;
            if (PROF.maxBw > 0) restrictions.maxBandwidth = PROF.maxBw;
          }
          return {
            drm: { clearKeys: { [keyId]: key } },
            manifest: {
              defaultPresentationDelay: 4,
              ignoreTextStreamFailures: true,
              retryParameters: { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 }
            },
            streaming: {
              lowLatencyMode: false,
              bufferingGoal: PROF.buf,
              rebufferingGoal: PROF.reBuf,
              bufferBehind: PROF.behind,
              safeSeekOffset: 4,
              stallEnabled: true,
              stallThreshold: 1,
              stallSkip: 0.3,
              inaccurateManifestTolerance: 0,
              retryParameters: { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 }
            },
            abr: {
              enabled: true,
              defaultBandwidthEstimate: PROF.bwEst,
              switchInterval: 4,
              restrictions: restrictions
            }
          };
        }

        async function reloadStream() {
          const now = Date.now();
          if (refreshing || now - lastRetry < 1500) return;
          if (retries >= 5) {
            showStatus("Stream unavailable. Please try again later.", "error", 0);
            return;
          }
          refreshing = true;
          lastRetry = now;
          retries++;
          showStatus(`Reconnecting... (${retries}/5)`, "warning", 0);
          try {
            const freshChannels = await fetchChannels();
            const fresh = freshChannels.find(c => c.id === channel.id);
            if (!fresh) throw new Error("Channel missing");
            currentChannel = fresh;
            const newCookie = fresh.cookie;
            const newRaw = rawCookie(newCookie);
            streamUrl = fresh.stream_url;
            
            const config = buildConfig();
            if (window.shakaPlayer) {
              await window.shakaPlayer.configure(config);
              await window.shakaPlayer.load(streamUrl);
            }
            retries = 0;
            showStatus("● Live", "", 4000);
          } catch (e) {
            setTimeout(reloadStream, Math.min(1000 * Math.pow(2, retries - 1), 8000));
          } finally {
            refreshing = false;
          }
        }

        try {
          // Use Shaka Player internally with Plyr
          const shaka = window.shaka;
          shaka.polyfill.installAll();
          
          if (!shaka.Player.isBrowserSupported()) {
            throw new Error("Browser not supported");
          }

          const shakaPlayer = new shaka.Player();
          window.shakaPlayer = shakaPlayer;
          await shakaPlayer.attach(videoPlayer);
          
          shakaPlayer.configure(buildConfig());

          const NetEngine = shaka.net.NetworkingEngine;
          shakaPlayer.getNetworkingEngine().registerRequestFilter(function(type, req) {
            req.headers["Referer"] = "https://www.jiotv.com/";
            req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
            req.headers["Cookie"] = cookie;
            if (type === NetEngine.RequestType.MANIFEST || type === NetEngine.RequestType.SEGMENT) {
              req.uris = req.uris.map(u => withCookie(u, raw));
            }
          });

          shakaPlayer.addEventListener('error', (event) => {
            const err = event.detail;
            if (err.code === 4014 && !restrictionsRelaxed) {
              restrictionsRelaxed = true;
              shakaPlayer.configure(buildConfig());
              shakaPlayer.load(streamUrl).catch(() => reloadStream());
            } else if ([1001, 1002, 1003, 4012, 6006, 6007, 7000, 7001, 7002].includes(err.code)) {
              reloadStream();
            } else {
              showStatus("Playback error", "error", 5000);
            }
          });

          setLoadingMessage("Loading stream...");
          await shakaPlayer.load(streamUrl);
          
          // Plyr already handles play/pause UI
          videoPlayer.play().catch(() => {});
          showStatus("Tap play to start", "", 5000);
          
        } catch (e) {
          console.error(e);
          showStatus("Stream loading failed, retrying...", "warning", 0);
          setTimeout(reloadStream, 1500);
        }
      }

      // Event Listeners
      backButton.addEventListener('click', () => {
        playerScreen.style.display = 'none';
        channelsScreen.style.display = 'flex';
        if (plyrInstance) {
          plyrInstance.destroy();
          plyrInstance = null;
        }
        if (window.shakaPlayer) {
          window.shakaPlayer.destroy();
          window.shakaPlayer = null;
        }
        videoPlayer.src = '';
        history.pushState({}, '', window.location.pathname);
      });

      fitButton.addEventListener('click', () => {
        fitMode = (fitMode + 1) % 3;
        applyFitMode();
      });

      pipButton.addEventListener('click', async () => {
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else if (document.pictureInPictureEnabled) {
            await videoPlayer.requestPictureInPicture();
          }
        } catch (e) {
          showStatus("PiP not available", "warning", 2000);
        }
      });

      videoPlayer.addEventListener('enterpictureinpicture', () => pipButton.classList.add('active'));
      videoPlayer.addEventListener('leavepictureinpicture', () => pipButton.classList.remove('active'));

      // Initial load
      async function init() {
        const id = getChannelId();
        try {
          setLoadingMessage("Fetching channels...");
          const channels = await fetchChannels();
          if (!id) {
            renderChannelList(channels);
          } else {
            const channel = channels.find(c => c.id === id);
            if (!channel) {
              setLoadingMessage("Channel not found.");
              return;
            }
            document.title = `Sportlink · ${channel.name}`;
            await initializePlayer(channel);
          }
        } catch (e) {
          setLoadingMessage("Connection error. Please refresh.");
          showStatus("Failed to load data", "error", 0);
        }
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>

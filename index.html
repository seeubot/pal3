<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sportlink · Live Sports</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Loading Screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a0a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 20px;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(239, 68, 68, 0.2);
      border-top: 3px solid #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Status Toast */
    .status-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(15, 15, 25, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      color: #e2e8f0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .status-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status-toast.error {
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .status-toast.warning {
      border-color: rgba(251, 146, 60, 0.5);
      color: #fb923c;
    }

    /* Channels Screen */
    .channels-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0a0f 0%, #0f0a0a 100%);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      z-index: 100;
    }

    .channels-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding: 10px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .live-text {
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding-bottom: 20px;
    }

    .channel-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .channel-card:hover {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.15);
    }

    .channel-card:active {
      transform: scale(0.98);
    }

    .card-icon-wrapper {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .card-channel-name {
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
    }

    .card-sport-icon {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Player Screen */
    .player-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 200;
    }

    .player-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .video-js {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .video-js .vjs-tech {
      object-fit: contain;
    }

    .video-js.vjs-fit-fill .vjs-tech {
      object-fit: fill;
    }

    .video-js.vjs-fit-cover .vjs-tech {
      object-fit: cover;
    }

    /* Custom video.js theme */
    .video-js .vjs-control-bar {
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      border: none;
      padding: 10px 0;
    }

    .video-js .vjs-play-progress {
      background: #ef4444;
    }

    .video-js .vjs-volume-level {
      background: #ef4444;
    }

    .video-js .vjs-big-play-button {
      background: rgba(239, 68, 68, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 80px;
      height: 80px;
      line-height: 80px;
      font-size: 30px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .video-js:hover .vjs-big-play-button {
      background: rgba(239, 68, 68, 1);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .player-controls-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .back-button, .fit-button {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }

    .back-button:hover, .fit-button:hover {
      background: rgba(0, 0, 0, 0.8);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .channel-name-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
      color: white;
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      .channels-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
      
      .channel-card {
        padding: 15px 10px;
      }
      
      .video-js .vjs-big-play-button {
        width: 60px;
        height: 60px;
        line-height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loader"></div>
    <p id="loadingMessage" class="loading-text">Loading sport channels...</p>
  </div>

  <!-- Status Toast -->
  <div id="statusToast" class="status-toast"></div>

  <!-- Channels Screen -->
  <div id="channelsScreen" class="channels-screen">
    <div class="channels-header">
      <div class="logo-section">
        <div class="logo-icon">▶</div>
        <span class="logo-text">Sportlink</span>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
    </div>
    <div id="channelsGrid" class="channels-grid"></div>
  </div>

  <!-- Player Screen -->
  <div id="playerScreen" class="player-screen">
    <div class="player-wrapper">
      <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls playsinline preload="auto">
        <p class="vjs-no-js">To view this video please enable JavaScript</p>
      </video>
      <div class="player-controls-overlay">
        <button class="back-button" id="backButton" title="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="channel-name-overlay" id="channelNameOverlay">Loading...</div>
        <button class="fit-button" id="fitButton" title="Change fit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="2" y1="21" x2="22" y2="21"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.0/dist/shaka-player.compiled.min.js"></script>
  <script>
    (function() {
      "use strict";

      const API = "https://sonujson-devloper.vercel.app/Data/sports.json";
      
      // DOM Elements
      const loadingScreen = document.getElementById('loadingScreen');
      const loadingMessage = document.getElementById('loadingMessage');
      const statusToast = document.getElementById('statusToast');
      const channelsScreen = document.getElementById('channelsScreen');
      const channelsGrid = document.getElementById('channelsGrid');
      const playerScreen = document.getElementById('playerScreen');
      const videoElement = document.getElementById('videoPlayer');
      const channelNameOverlay = document.getElementById('channelNameOverlay');
      const backButton = document.getElementById('backButton');
      const fitButton = document.getElementById('fitButton');

      let videoJS = null;
      let shakaPlayer = null;
      let currentChannel = null;
      let fitMode = 0; // 0: contain, 1: fill, 2: cover
      let statusTimer = null;
      let retryCount = 0;
      let isRefreshing = false;
      let lastRetryTime = 0;

      const fitIcons = [
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/></svg>',
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><circle cx="12" cy="10" r="3"/></svg>'
      ];

      // Utility functions
      function showStatus(msg, type = '', duration = 4000) {
        statusToast.textContent = msg;
        statusToast.className = 'status-toast show ' + type;
        if (statusTimer) clearTimeout(statusTimer);
        if (duration > 0) {
          statusTimer = setTimeout(() => {
            statusToast.classList.remove('show');
          }, duration);
        }
      }

      function getTier() {
        const mem = navigator.deviceMemory || 4;
        const cores = navigator.hardwareConcurrency || 4;
        const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const net = conn ? (conn.effectiveType || "4g") : "4g";
        if (!mobile) return "high";
        if (mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
        if (mem <= 3 || cores <= 4) return "mid";
        return "high";
      }

      const TIER = getTier();
      const PROF = {
        low: { buf: 5, reBuf: 1.5, behind: 15, maxH: 480, maxBw: 1200000, bwEst: 400000 },
        mid: { buf: 8, reBuf: 1.5, behind: 25, maxH: 720, maxBw: 3500000, bwEst: 1000000 },
        high: { buf: 12, reBuf: 1.5, behind: 30, maxH: 1080, maxBw: 0, bwEst: 2000000 }
      }[TIER];

      function getChannelId() {
        return new URLSearchParams(location.search).get("id") || "";
      }

      function rawCookie(c) {
        return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
      }

      function withCookie(u, r) {
        if (!u || !r) return u;
        if (u.indexOf("__hdnea__") !== -1) return u;
        return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
      }

      async function fetchChannels() {
        const response = await fetch(API, { cache: "no-store", headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!data || !Array.isArray(data.channels) || !data.channels.length) throw new Error("No channels available");
        return data.channels;
      }

      function renderChannelList(channels) {
        channelsGrid.innerHTML = '';
        channels.forEach(ch => {
          const card = document.createElement('a');
          card.className = 'channel-card';
          card.href = `?id=${encodeURIComponent(ch.id)}`;
          card.innerHTML = `
            <div class="card-icon-wrapper">📺</div>
            <span class="card-channel-name">${ch.name}</span>
            <span class="card-sport-icon">LIVE</span>
          `;
          channelsGrid.appendChild(card);
        });
        loadingScreen.style.display = 'none';
        channelsScreen.style.display = 'flex';
      }

      function applyFitMode() {
        if (!videoJS) return;
        const el = videoJS.el();
        el.classList.remove('vjs-fit-fill', 'vjs-fit-cover');
        if (fitMode === 1) el.classList.add('vjs-fit-fill');
        if (fitMode === 2) el.classList.add('vjs-fit-cover');
        fitButton.innerHTML = fitIcons[fitMode];
      }

      async function initializePlayer(channel) {
        playerScreen.style.display = 'block';
        channelsScreen.style.display = 'none';
        loadingScreen.style.display = 'none';
        channelNameOverlay.textContent = channel.name;
        currentChannel = channel;
        fitMode = 0;
        retryCount = 0;
        isRefreshing = false;

        // Destroy previous instances if they exist
        if (videoJS) {
          videoJS.dispose();
          videoJS = null;
        }
        if (shakaPlayer) {
          shakaPlayer.destroy();
          shakaPlayer = null;
        }

        // Initialize Video.js
        videoJS = videojs(videoElement, {
          controls: true,
          autoplay: false,
          preload: 'auto',
          playbackRates: [0.5, 1, 1.5, 2],
          controlBar: {
            children: [
              'playToggle',
              'volumePanel',
              'currentTimeDisplay',
              'timeDivider',
              'durationDisplay',
              'progressControl',
              'liveDisplay',
              'remainingTimeDisplay',
              'customControlSpacer',
              'playbackRateMenuButton',
              'chaptersButton',
              'descriptionsButton',
              'subsCapsButton',
              'audioTrackButton',
              'pictureInPictureToggle',
              'fullscreenToggle'
            ]
          }
        });

        applyFitMode();

        // Initialize Shaka Player
        shaka.polyfill.installAll();
        
        if (!shaka.Player.isBrowserSupported()) {
          showStatus("Browser not supported for this stream", "error", 5000);
          return;
        }

        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(videoElement);

        // Configure network engine
        const cookie = channel.cookie;
        const raw = rawCookie(cookie);
        
        function buildShakaConfig(relaxRestrictions = false) {
          const restrictions = {};
          if (!relaxRestrictions) {
            if (PROF.maxH < 1080) restrictions.maxHeight = PROF.maxH;
            if (PROF.maxBw > 0) restrictions.maxBandwidth = PROF.maxBw;
          }
          
          return {
            drm: { 
              clearKeys: { 
                [channel.key_id]: channel.key 
              } 
            },
            manifest: {
              defaultPresentationDelay: 4,
              retryParameters: {
                maxAttempts: 5,
                baseDelay: 1000,
                backoffFactor: 2,
                fuzzFactor: 0.5,
                timeout: 30000
              }
            },
            streaming: {
              bufferingGoal: PROF.buf,
              rebufferingGoal: PROF.reBuf,
              bufferBehind: PROF.behind,
              safeSeekOffset: 4,
              stallEnabled: true,
              stallThreshold: 1,
              stallSkip: 0.3,
              retryParameters: {
                maxAttempts: 5,
                baseDelay: 1000,
                backoffFactor: 2,
                fuzzFactor: 0.5,
                timeout: 30000
              }
            },
            abr: {
              enabled: true,
              defaultBandwidthEstimate: PROF.bwEst,
              switchInterval: 4,
              restrictions: restrictions
            }
          };
        }

        shakaPlayer.configure(buildShakaConfig());

        shakaPlayer.getNetworkingEngine().registerRequestFilter(function(type, request) {
          request.headers["Referer"] = "https://www.jiotv.com/";
          request.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
          request.headers["Cookie"] = cookie;
          
          if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
              type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
            request.uris = request.uris.map(u => withCookie(u, raw));
          }
        });

        // Handle errors and recovery
        shakaPlayer.addEventListener('error', async (event) => {
          const error = event.detail;
          console.error('Shaka error:', error);
          
          if (error.code === 4014 && !isRefreshing) {
            // Try with relaxed restrictions
            shakaPlayer.configure(buildShakaConfig(true));
            try {
              await shakaPlayer.load(channel.stream_url);
              showStatus("Playing at best available quality", "warning", 3000);
            } catch (e) {
              reloadStream();
            }
          } else if ([1001, 1002, 1003, 4012, 6006, 6007, 7000, 7001, 7002].includes(error.code)) {
            reloadStream();
          } else {
            showStatus("Playback error: " + (error.message || "Unknown error"), "error", 5000);
          }
        });

        async function reloadStream() {
          if (isRefreshing || Date.now() - lastRetryTime < 2000) return;
          
          isRefreshing = true;
          lastRetryTime = Date.now();
          retryCount++;
          
          if (retryCount > 5) {
            showStatus("Stream unavailable. Please try again later.", "error", 0);
            isRefreshing = false;
            return;
          }
          
          showStatus(`Reconnecting... (${retryCount}/5)`, "warning", 0);
          
          try {
            const channels = await fetchChannels();
            const fresh = channels.find(c => c.id === channel.id);
            if (fresh) {
              currentChannel = fresh;
              shakaPlayer.configure(buildShakaConfig());
              await shakaPlayer.load(fresh.stream_url);
              retryCount = 0;
              showStatus("● Live", "", 3000);
            }
          } catch (e) {
            setTimeout(reloadStream, Math.min(2000 * retryCount, 8000));
          } finally {
            isRefreshing = false;
          }
        }

        // Load the stream
        try {
          showStatus("Loading stream...", "warning", 0);
          await shakaPlayer.load(channel.stream_url);
          videoJS.play().catch(() => {
            // Auto-play might be blocked
            showStatus("Tap play to start", "", 4000);
          });
          showStatus("Stream ready", "", 3000);
        } catch (error) {
          console.error('Initial load failed:', error);
          reloadStream();
        }
      }

      // Event listeners
      backButton.addEventListener('click', () => {
        if (shakaPlayer) {
          shakaPlayer.destroy();
          shakaPlayer = null;
        }
        if (videoJS) {
          videoJS.dispose();
          videoJS = null;
        }
        playerScreen.style.display = 'none';
        channelsScreen.style.display = 'flex';
        history.pushState({}, '', window.location.pathname);
      });

      fitButton.addEventListener('click', () => {
        fitMode = (fitMode + 1) % 3;
        applyFitMode();
      });

      // Keyboard shortcut for fit mode
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' && e.ctrlKey && playerScreen.style.display === 'block') {
          e.preventDefault();
          fitMode = (fitMode + 1) % 3;
          applyFitMode();
        }
      });

      // Initialize app
      async function init() {
        const id = getChannelId();
        try {
          loadingMessage.textContent = "Fetching channels...";
          const channels = await fetchChannels();
          
          if (!id) {
            renderChannelList(channels);
          } else {
            const channel = channels.find(c => c.id === id);
            if (!channel) {
              loadingMessage.textContent = "Channel not found.";
              return;
            }
            document.title = `Sportlink · ${channel.name}`;
            await initializePlayer(channel);
          }
        } catch (error) {
          console.error('Init error:', error);
          loadingMessage.textContent = "Connection error. Please refresh the page.";
          showStatus("Failed to load channels", "error", 0);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
